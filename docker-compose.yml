services:
  server:
    build:
      context: ./server
    container_name: netguard-server
    environment:
      NETGUARD_DB_URL: sqlite:////app/data/netguard.db
    ports:
      - "8000:8000"
    volumes:
      - netguard-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/status', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  agent-demo:
    build:
      context: ./agent
    container_name: netguard-agent-demo
    command:
      - python
      - agent.py
      - --server
      - http://server:8000
      - --interval
      - "1"
      - --simulate
      - --host
      - docker-demo
    depends_on:
      server:
        condition: service_healthy
    profiles:
      - demo
    restart: unless-stopped

volumes:
  netguard-data:
